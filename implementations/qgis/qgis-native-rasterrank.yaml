id: qgis-native-rasterrank
kind: implementation
name: native:rasterrank
software: qgis
call: {interface: qgis-process, name: 'native:rasterrank'}
harvest: {harvester: qgis, engine_version: 4.2.3}
parameters:
  CELL_SIZE: {type: number}
  CRS: {type: crs}
  EXTENT: {type: extent}
  INPUT_RASTERS: {type: multilayer, required: true}
