id: grass-v-db-connect
kind: implementation
name: v.db.connect
software: grass
call: {interface: cli, name: v.db.connect}
harvest: {harvester: grass, engine_version: 8.5.0}
parameters:
  map: {type: string, required: true, note: vector name}
  driver: {type: string, default: sqlite, values: [dbf, ogr, pg, sqlite], note: dbdriver name}
  database: {type: string, default: $GISDBASE/$LOCATION_NAME/$MAPSET/sqlite/sqlite.db, note: dbname name}
  table: {type: string, note: dbtable name}
  key: {type: string, default: cat}
  layer: {type: string, default: '1', note: output layer}
  separator: {type: string, note: separator name}
  format: {type: string, values: [plain, csv, json]}
  flag_p: {type: boolean, note: flag -p}
  flag_g: {type: boolean, note: flag -g}
  flag_c: {type: boolean, note: flag -c}
  flag_d: {type: boolean, note: flag -d}
  flag_overwrite: {type: boolean, note: flag --overwrite}
status: active
review: {state: harvested, source: grass}
