id: grass-r-import
kind: implementation
name: r.import
software: grass
call: {interface: cli, name: r.import}
harvest: {harvester: grass, engine_version: 8.5.0}
parameters:
  input: {type: string, required: true, note: bin name}
  band: {type: integer, note: multiple values}
  memory: {type: integer, default: 300}
  output: {type: string, note: output cell}
  resample: {type: string, default: nearest, values: [nearest, bilinear, bicubic, lanczos, bilinear_f, bicubic_f, lanczos_f]}
  extent: {type: string, default: input, values: [input, region]}
  resolution: {type: string, default: estimated, values: [estimated, value, region]}
  resolution_value: {type: float}
  title: {type: string}
  flag_e: {type: boolean, note: flag -e}
  flag_n: {type: boolean, note: flag -n}
  flag_l: {type: boolean, note: flag -l}
  flag_o: {type: boolean, note: flag -o}
  flag_overwrite: {type: boolean, note: flag --overwrite}
status: active
review: {state: harvested, source: grass}
