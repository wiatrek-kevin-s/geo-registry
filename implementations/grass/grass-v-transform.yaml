  flag_t: {type: boolean, note: flag -t}
  flag_w: {type: boolean, note: flag -w}
  flag_x: {type: boolean, note: flag -x}
  flag_y: {type: boolean, note: flag -y}
  flag_a: {type: boolean, note: flag -a}
  flag_b: {type: boolean, note: flag -b}
