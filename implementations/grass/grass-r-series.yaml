id: grass-r-series
kind: implementation
name: r.series
software: grass
call: {interface: cli, name: r.series}
harvest: {harvester: grass, engine_version: 8.5.0}
parameters:
  input: {type: string, note: cell name; multiple values}
  file: {type: string, note: file name}
  output: {type: string, required: true, note: output cell; multiple values}
  method: {type: string, required: true, values: [average, count, median, mode, minimum, min_raster, maximum, max_raster,
      stddev, range, sum, variance, diversity, slope, offset, detcoeff, tvalue, quart1, quart3, perc90, quantile, skewness,
      kurtosis], note: multiple values}
  quantile: {type: float, values: [0.0-1.0], note: multiple values}
  weights: {type: float, note: multiple values}
  range: {type: float}
  nprocs: {type: integer, default: 0}
  memory: {type: integer, default: 300}
  flag_n: {type: boolean, note: flag -n}
  flag_z: {type: boolean, note: flag -z}
  flag_overwrite: {type: boolean, note: flag --overwrite}
status: active
review: {state: harvested, source: grass}
