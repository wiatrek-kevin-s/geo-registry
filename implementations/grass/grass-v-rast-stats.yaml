      values}
  where: {type: string, note: sql_query name}
  raster: {type: string, required: true, note: cell name; multiple values}
  column_prefix: {type: string, required: true, note: multiple values}
  method: {type: string, default: 'number,null_cells,minimum,maximum,range,average,stddev,variance,coeff_var,sum,first_quartile,median,third_quartile,percentile',
    values: [number, null_cells, minimum, maximum, range, average, stddev, variance, coeff_var, sum, first_quartile, median,
      third_quartile, percentile], note: multiple values}
  percentile: {type: integer, default: 90, values: [0-100]}
  flag_c: {type: boolean, note: flag -c}
  flag_d: {type: boolean, note: flag -d}
status: active
review: {state: harvested, source: grass}
