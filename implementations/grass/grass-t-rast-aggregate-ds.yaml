      kurtosis]}
  offset: {type: integer, default: 0}
  nprocs: {type: integer, default: 1}
  sampling: {type: string, default: contains, values: [equal, overlaps, overlapped, starts, started, finishes, finished, during,
      contains], note: multiple values}
  where: {type: string}
  flag_n: {type: boolean, note: flag -n}
  flag_overwrite: {type: boolean, note: flag --overwrite}
