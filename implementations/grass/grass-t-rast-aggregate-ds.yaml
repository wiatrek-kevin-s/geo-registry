id: grass-t-rast-aggregate-ds
kind: implementation
name: t.rast.aggregate.ds
software: grass
call: {interface: cli, name: t.rast.aggregate.ds}
harvest: {harvester: grass, engine_version: 8.5.0}
parameters:
  input: {type: string, required: true, note: strds name}
  sample: {type: string, required: true, note: stds name}
