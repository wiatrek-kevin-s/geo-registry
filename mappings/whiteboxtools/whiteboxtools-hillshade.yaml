id: whiteboxtools-hillshade
implements: hillshade
crosswalk:
  raster: dem
  output: output
  azimuth: azimuth
  altitude: altitude
  z_unit: { fixed: crs-units, note: "Elevation is taken in the CRS's horizontal units; otherwise set zfactor." }
differences:
  - Output values run from 0 to 32767, not 0 to 255 as in GDAL, QGIS and PostGIS.
  - Defaults to altitude 30 (Columbus and GDAL use 45).
effects: { modifies_input: false, network: false }
review: { state: draft }
