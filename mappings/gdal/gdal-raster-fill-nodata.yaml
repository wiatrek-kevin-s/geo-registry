id: gdal-raster-fill-nodata
implements: fill-nodata
crosswalk:
  raster: input
  output: output
differences:
  - A single missing cell on a plane (neighbours 9.5 and 11.5 west and east, 10.5 north and south) was filled with 10.96, not 10.5 (GDAL 3.13).
  - Inverse distance weighting from the gap's edge (strategy invdist) or nearest; max-distance (100 cells) limits the search.
effects: { modifies_input: false, network: false }
review: { state: draft }
