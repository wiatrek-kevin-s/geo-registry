id: turf-polygontoline
implements: polygons-to-lines
crosswalk:
  layer: poly
differences:
  - One polygon (a Feature or geometry) per call, not a FeatureCollection.
  - Turf works on GeoJSON in longitude/latitude (WGS 84); data in another CRS must be reprojected first.
effects: { modifies_input: false, network: false }
review: { state: draft }
