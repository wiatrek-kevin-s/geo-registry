id: turf-lineintersect
implements: line-intersections
crosswalk:
  a: line1
  b: line2
differences:
  - options.removeDuplicates and ignoreSelfIntersections control repeated and self-crossing points.
  - Turf works on GeoJSON in longitude/latitude (WGS 84); data in another CRS must be reprojected first.
effects: { modifies_input: false, network: false }
review: { state: draft }
