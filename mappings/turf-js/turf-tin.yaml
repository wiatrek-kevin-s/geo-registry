id: turf-tin
implements: delaunay-triangulation
crosswalk:
  layer: points
  tolerance: { fixed: 0 }
differences:
  - z names a property whose values become the triangles' a, b and c properties.
  - Turf works on GeoJSON in longitude/latitude (WGS 84); data in another CRS must be reprojected first.
effects: { modifies_input: false, network: false }
review: { state: draft }
