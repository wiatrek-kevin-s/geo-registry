id: geopandas-geoseries-difference
implements: difference
crosswalk:
  mask: other
differences:
  - Element-wise against another GeoSeries (aligned on the index), or against one geometry; union the mask first to subtract all of it. geopandas.overlay(how='difference') works on whole layers.
effects: { modifies_input: false, network: false }
