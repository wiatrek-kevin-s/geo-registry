name: Engines

# Runs real GIS engines from conda-forge (GDAL, PDAL, Shapely, GeoPandas, rasterio,
# rioxarray, xarray-spatial, rasterstats, dask-geopandas, PostGIS,
# QGIS, GRASS, WhiteboxTools, about 40 more Python packages, R's sf and terra, TauDEM,
# LAStools), DuckDB spatial, RustGIS (PyPI) and Turf.js (npm):
# - equivalence: every mapped implementation is run on the same small inputs
#   and must agree (checks/equivalence.py);
# - harvest: the harvesters are re-run against the newest engine releases and,
#   if any tool or parameter changed, a pull request with the changes is opened.

# The equivalence tests run on every pull request, because main requires them to
# pass before anything merges.
on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      checks_only:
        description: "Only run the equivalence tests (no re-harvest)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  equivalence:
    name: Equivalence tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build
      - name: Build the index
        working-directory: build
        run: cargo run --locked --release -q -- build --out ../dist
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: harvest/environment.yml
          cache-environment: true
      - name: PostGIS, QGIS, WhiteboxTools, GRASS, R (sf, terra)
        shell: bash -el {0}
        run: |
          for e in postgis qgis whitebox grass r; do micromamba create -y -q -f "harvest/environment-$e.yml"; done
          envs="$MAMBA_ROOT_PREFIX/envs"
          echo "PGBIN=$envs/geo-registry-postgis/bin" >> "$GITHUB_ENV"
          echo "QGIS_PROCESS=$envs/geo-registry-qgis/bin/qgis_process" >> "$GITHUB_ENV"
          echo "WBT=$envs/geo-registry-whitebox/bin/whitebox_tools" >> "$GITHUB_ENV"
          echo "RSCRIPT=$envs/geo-registry-r/bin/Rscript" >> "$GITHUB_ENV"
          echo "GRASS=$envs/geo-registry-grass/bin/grass" >> "$GITHUB_ENV"
          npm install --ignore-scripts --no-audit --no-fund --silent --prefix "$RUNNER_TEMP/turf" @turf/turf
          echo "TURF=$RUNNER_TEMP/turf/node_modules" >> "$GITHUB_ENV"
      - name: Run every mapped implementation on the same inputs
        shell: bash -el {0}
        run: |
          dsn=$(harvest/start-postgis.sh "$PGBIN" "$RUNNER_TEMP/pg")
          python -I checks/equivalence.py dist --gdal "$(which gdal)" --psql "$PGBIN/psql" --dsn "$dsn" \
            --qgis-process "$QGIS_PROCESS" --wbt "$WBT" --rscript "$RSCRIPT" --grass "$GRASS" --turf "$TURF"

  harvest:
    name: Re-harvest engines
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.checks_only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: harvest/environment.yml
      - name: Engines
        shell: bash -el {0}
        run: |
          for e in pdal postgis qgis grass whitebox python r cli; do micromamba create -y -q -f "harvest/environment-$e.yml"; done
          envs="$MAMBA_ROOT_PREFIX/envs"
          "$envs/geo-registry-python/bin/python" -m pip install -q rustgis
          npm install --ignore-scripts --no-audit --no-fund --silent --prefix "$RUNNER_TEMP/turf" @turf/turf typescript@5
          echo "PYENV=$envs/geo-registry-python" >> "$GITHUB_ENV"
          echo "RSCRIPT=$envs/geo-registry-r/bin/Rscript" >> "$GITHUB_ENV"
          echo "CLIENV=$envs/geo-registry-cli" >> "$GITHUB_ENV"
          echo "PGBIN=$envs/geo-registry-postgis/bin" >> "$GITHUB_ENV"
          echo "PDAL=$envs/geo-registry-pdal/bin/pdal" >> "$GITHUB_ENV"
          echo "QGIS_PROCESS=$envs/geo-registry-qgis/bin/qgis_process" >> "$GITHUB_ENV"
          echo "GRASS=$envs/geo-registry-grass/bin/grass" >> "$GITHUB_ENV"
          echo "GRASS_PROJ=$envs/geo-registry-grass/share/proj" >> "$GITHUB_ENV"
          echo "WBT=$envs/geo-registry-whitebox/bin/whitebox_tools" >> "$GITHUB_ENV"
      - name: Harvest
        shell: bash -el {0}
        run: |
          dsn=$(harvest/start-postgis.sh "$PGBIN" "$RUNNER_TEMP/pg")
          python harvest/gdal.py --gdal "$(which gdal)" | tee -a "$RUNNER_TEMP/summary.txt"
          python harvest/pdal.py --pdal "$PDAL" | tee -a "$RUNNER_TEMP/summary.txt"
          python harvest/postgis.py --psql "$PGBIN/psql" --dsn "$dsn" | tee -a "$RUNNER_TEMP/summary.txt"
          python harvest/python_libs.py | tee -a "$RUNNER_TEMP/summary.txt"
          python harvest/qgis.py --qgis-process "$QGIS_PROCESS" | tee -a "$RUNNER_TEMP/summary.txt"
          PROJ_DATA="$GRASS_PROJ" python harvest/grass.py --grass "$GRASS" | grep -v '^  skipped' | tee -a "$RUNNER_TEMP/summary.txt"
          python harvest/whitebox.py --wbt "$WBT" | tee -a "$RUNNER_TEMP/summary.txt"
          PYTHONWARNINGS=ignore "$PYENV/bin/python" harvest/python_packages.py 2>/dev/null | grep -v '^  ' | tee -a "$RUNNER_TEMP/summary.txt"
          "$PYENV/bin/python" harvest/duckdb_spatial.py | tee -a "$RUNNER_TEMP/summary.txt"
          "$PYENV/bin/python" harvest/rustgis.py | tee -a "$RUNNER_TEMP/summary.txt"
          python harvest/r_packages.py --rscript "$RSCRIPT" | tee -a "$RUNNER_TEMP/summary.txt"
          python harvest/cli_packages.py --prefix "$CLIENV" | tee -a "$RUNNER_TEMP/summary.txt"
          python harvest/turf.py --node-modules "$RUNNER_TEMP/turf/node_modules" | tee -a "$RUNNER_TEMP/summary.txt"
          {
            echo "Re-harvested from the newest engine releases on conda-forge:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/summary.txt"
            echo
            echo "Check that mappings still validate (CI) and the equivalence tests pass before merging."
          } > "$RUNNER_TEMP/body.md"
      - name: Open a pull request if anything changed
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: harvest/engines
          commit-message: "Re-harvest engines"
          title: "Re-harvest engines: new tool descriptions"
          body-path: ${{ runner.temp }}/body.md
          add-paths: implementations/**
      - name: Run the required checks on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref harvest/engines
          gh workflow run engines.yml --ref harvest/engines -f checks_only=true
