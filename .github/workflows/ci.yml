name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  entries:
    name: Seed converter check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml
      - name: Entries match the converter output
        run: python seed/convert.py --check --quiet

  rust:
    name: Rust (${{ matrix.os }})
    needs: entries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: Validate all entries
        run: cargo run --locked --release -- validate --entries ../entries --schema ../schema/entry.schema.json
      - name: Build index
        run: cargo run --locked --release -- build --entries ../entries --schema ../schema/entry.schema.json --out ../dist
      - name: Smoke search
        run: cargo run --locked --release -- search lidar --kind data --db ../dist/registry.sqlite --limit 3
      - name: Upload dist
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: geo-registry-dist
          path: dist/
          if-no-files-found: error
