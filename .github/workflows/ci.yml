name: CI

on:
  push:
  pull_request:
  # Pull requests opened by the Health and Engines workflows do not trigger CI on
  # their own (GitHub's rule for its own token), so those workflows start it here.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entries:
    name: Seed converter check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml
      - name: Entries match the converter output
        run: python seed/convert.py --check --quiet
      - name: Health checker tests (local server, no internet)
        run: python -m unittest checks/test_health.py

  rust:
    name: Rust (${{ matrix.os }})
    needs: entries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: Validate all entries
        run: cargo run --locked --release -- validate --entries ../entries --schema ../schema/entry.schema.json
      - name: Build index
        run: cargo run --locked --release -- build --entries ../entries --schema ../schema/entry.schema.json --out ../dist
      - name: Smoke search
        run: cargo run --locked --release -- search lidar --kind data --db ../dist/registry.sqlite --limit 3
      - name: Index compatibility with main
        # Installed Columbus servers read the published index; a change may add
        # to it but not alter what they read (README, "Index compatibility").
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          export CARGO_TARGET_DIR="$PWD/target"
          (cd "$RUNNER_TEMP/base/build" && cargo run --locked --release -q -- build \
            --entries ../entries --schema ../schema/entry.schema.json --out "$RUNNER_TEMP/dist-base")
          python3 -I ../checks/index_compat.py "$RUNNER_TEMP/dist-base" ../dist
      - name: Upload dist
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: geo-registry-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the index
    # Every push to main republishes the rolling `index` release, which
    # Columbus servers download (`columbus-mcp registry update`).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: geo-registry-dist
          path: dist
      - name: Check the manifest
        working-directory: dist
        run: sha256sum -c index.sha256
      - name: Upload to the index release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view index >/dev/null 2>&1 || \
            gh release create index --title "Registry index (rolling)" \
              --notes "The current registry index, rebuilt on every change to main. Columbus servers download it with columbus-mcp registry update." --latest=false
          gh release upload index dist/registry.sqlite dist/index.json dist/index.sha256 --clobber

  site-check:
    name: Site check
    # Runs on every event, including workflow_dispatch, so Health and Engines
    # PRs get this check too. Builds and tests the site; deploys nothing.
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE: ${{ vars.SITE_BASE }}
      CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      REGISTRY_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: geo-registry-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint and format
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Build the site and search index
        run: npm run build
      - name: Internal links
        run: npm run check:links
      - name: Unit tests
        run: npm run test:unit
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        env:
          CI: "true"
        run: npm run test:e2e
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  site-deploy:
    name: Deploy the site
    # Every push to main publishes the site built by site-check.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish, site-check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
