id: fema-nfhl
kind: data
name: FEMA NFHL
summary: National Flood Hazard Layer of effective flood zones and FIRM panels.
publisher: Federal Emergency Management Agency
themes:
- us-federal-hazards
- open-data-sources
coverage:
  region: United States
  bbox:
  - -179.2
  - -14.6
  - 180.0
  - 71.4
license: LicenseRef-Public-Domain
license_original: Public domain
access:
- type: http
  url: https://www.fema.gov/flood-maps/national-flood-hazard-layer
  auth: none
- type: arcgis-rest
  url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer
  index: '28'
  auth: none
  notes: Flood Hazard Zones (S_FLD_HAZ_AR). Always pass a bbox; the national layer is very large.
- type: ogc-wms
  url: https://hazards.fema.gov/arcgis/rest/services/public/NFHLWMS/MapServer/WMSServer
  auth: none
  notes: WMS of the effective NFHL (FEMA's service page, read 2026-11-05).
- type: ogc-wfs
  url: https://hazards.fema.gov/arcgis/services/public/NFHL/MapServer/WFSServer
  auth: none
  notes: At most 1,000 features per request; use the Map Service Center's state and county downloads for
    bulk.
recipe:
  tool: registry_fetch
  steps:
  - Fetch access 1 with a bbox no larger than a county.
  - Report the FLD_ZONE values found and the effective date fields with the result.
notes: The public NFHL service holds effective data only; preliminary and pending services exist separately
  and are not for rating flood insurance. TLS 1.2 only.
status: active
