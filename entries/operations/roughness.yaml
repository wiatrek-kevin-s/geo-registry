id: roughness
kind: operation
name: Roughness
aka: [surface roughness, local relief, gdaldem roughness]
summary: The difference between the highest and lowest elevation in each cell's 3 by 3 neighbourhood.
group: raster/terrain
inputs:
  - { name: raster, type: raster, note: An elevation model. }
